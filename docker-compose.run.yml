x-postgres-env: &postgres-env
  POSTGRES_HOST: dfs-postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: ${POSTGRES_DB:-dfs}
  POSTGRES_USER: ${POSTGRES_USER:-dfs}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set (copy .env.example to .env)}

# Every service comes back when Docker starts (with WSL, or after a crash),
# unless it was stopped on purpose (make down).
services:
  dfs-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    labels:
      logging: "promtail"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dfs}
      POSTGRES_USER: ${POSTGRES_USER:-dfs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set (copy .env.example to .env)}
    volumes:
      - "dfs_postgres_data:/var/lib/postgresql/data"
    ports:
      # Host-local only: exposed for backfill scripts and psql, not the network.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dfs} -d ${POSTGRES_DB:-dfs}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app_network

  dfs-frontend:
    image: dfs-frontend
    restart: unless-stopped
    labels:
      logging: "promtail"
    ports:
      - "3000:80"
    depends_on:
      - dfs-api
    networks:
      - app_network

  dfs-api:
    image: dfs-api
    restart: unless-stopped
    labels:
      logging: "promtail"
    environment:
      <<: *postgres-env
      # uvicorn worker processes; "auto" is one per core, up to 4. Each holds
      # up to DB_POOL_SIZE + DB_MAX_OVERFLOW (default 10) DB connections.
      API_WORKERS: ${API_WORKERS:-auto}
      # Seconds each worker reuses a week's player pool; 0 disables.
      API_CACHE_TTL_SECONDS: ${API_CACHE_TTL_SECONDS:-300}
    ports:
      - "8080:8080"
    depends_on:
      dfs-postgres:
        condition: service_healthy
    networks:
      - app_network

  dfs-orchestration:
    image: dfs-orchestration
    restart: unless-stopped
    labels:
      logging: "promtail"
    environment:
      <<: *postgres-env
      BACKUP_RETENTION: ${BACKUP_RETENTION:-14}
      BACKFILL_START_YEAR: ${BACKFILL_START_YEAR:-2018}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
    volumes:
      # Backups live on the host, outside the database volume.
      - "${BACKUP_DIR:-/dfs_backups}:/backups"
    depends_on:
      dfs-postgres:
        condition: service_healthy
    networks:
      - app_network

volumes:
  dfs_postgres_data:
    name: dfs_postgres_data

networks:
  app_network:
    name: dfs_optimizer_network
    driver: overlay
    attachable: true
