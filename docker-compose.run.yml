x-postgres-env: &postgres-env
  POSTGRES_HOST: dfs-postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: ${POSTGRES_DB:-dfs}
  POSTGRES_USER: ${POSTGRES_USER:-dfs}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set (copy .env.example to .env)}

services:
  dfs-postgres:
    image: postgres:16-alpine
    labels:
      logging: "promtail"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dfs}
      POSTGRES_USER: ${POSTGRES_USER:-dfs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set (copy .env.example to .env)}
    volumes:
      - "dfs_postgres_data:/var/lib/postgresql/data"
    ports:
      # Host-local only: exposed for backfill scripts and psql, not the network.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dfs} -d ${POSTGRES_DB:-dfs}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app_network

  dfs-frontend:
    image: dfs-frontend
    labels:
      logging: "promtail"
    ports:
      - "3000:80"
    depends_on:
      - dfs-api
    networks:
      - app_network

  dfs-api:
    image: dfs-api
    labels:
      logging: "promtail"
    environment:
      <<: *postgres-env
    ports:
      - "8080:8080"
    depends_on:
      dfs-postgres:
        condition: service_healthy
    networks:
      - app_network

  dfs-orchestration:
    image: dfs-orchestration
    labels:
      logging: "promtail"
    environment:
      <<: *postgres-env
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
    depends_on:
      dfs-postgres:
        condition: service_healthy
    networks:
      - app_network

volumes:
  dfs_postgres_data:
    name: dfs_postgres_data

networks:
  app_network:
    name: dfs_optimizer_network
    driver: overlay
    attachable: true
