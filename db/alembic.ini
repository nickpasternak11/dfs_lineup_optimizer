[alembic]
script_location = migrations

# sqlalchemy.url is intentionally omitted -- migrations/env.py builds the URL
# from the same POSTGRES_* / DATABASE_URL environment variables the API and
# scrapers use (see shared/dfs_db/config.py), so there is one source of truth
# for how this project connects to Postgres.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
