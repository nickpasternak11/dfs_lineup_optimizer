services:
  dfs-frontend:
    image: dfs-frontend
    build:
      context: frontend/.
      target: service
    networks:
      - app_network

  # Services below build from the repo root so they can copy in shared/dfs_db.
  dfs-api:
    image: dfs-api
    build:
      context: .
      dockerfile: api/Dockerfile
      target: service
    networks:
      - app_network

  dfs-orchestration:
    image: dfs-orchestration
    build:
      context: system/orchestrator/.
      target: service
    networks:
      - app_network

  dfs-salary-scraper:
    image: dfs-salary-scraper
    build:
      context: .
      dockerfile: system/salary-scraper/Dockerfile
      target: service
    networks:
      - app_network

  dfs-projection-scraper:
    image: dfs-projection-scraper
    build:
      context: .
      dockerfile: system/projection-scraper/Dockerfile
      target: service
    networks:
      - app_network

  dfs-migration:
    image: dfs-migration
    build:
      context: .
      dockerfile: migration/Dockerfile
      target: service
    networks:
      - app_network

  dfs-db-migrate:
    image: dfs-db-migrate
    build:
      context: .
      dockerfile: db/Dockerfile
      target: service
    networks:
      - app_network

networks:
  app_network:
    name: dfs_optimizer_network
    driver: overlay
    attachable: true
